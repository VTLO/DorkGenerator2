name: 🤖 Build Android APK

on:
  # Déclencher sur push vers main
  push:
    branches: [ main, master ]
  
  # Déclencher sur pull request
  pull_request:
    branches: [ main, master ]
  
  # Permettre le déclenchement manuel
  workflow_dispatch:

jobs:
  build:
    name: 🏗️ Build APK
    runs-on: ubuntu-latest
    
    steps:
    # 1. Checkout du code
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    # 2. Setup Java 17
    - name: ☕ Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    
    # 3. Donner les permissions d'exécution à gradlew
    - name: 🔐 Grant execute permission for gradlew
      run: chmod +x gradlew
    
    # 4. Cache Gradle pour accélérer les builds
    - name: 📦 Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    
    # 5. Nettoyer le projet
    - name: 🧹 Clean project
      run: ./gradlew clean
    
    # 6. Compiler l'APK de debug
    - name: 🔨 Build Debug APK
      run: ./gradlew assembleDebug
    
    # 7. Signer l'APK (optionnel, pour debug)
    - name: ✍️ Sign APK
      run: |
        echo "APK Debug build completed"
        ls -lh app/build/outputs/apk/debug/
    
    # 8. Renommer l'APK avec la version et la date
    - name: 📝 Rename APK
      run: |
        cd app/build/outputs/apk/debug
        mv app-debug.apk DorkGenerator-v1.0-$(date +%Y%m%d-%H%M%S).apk
        ls -lh
    
    # 9. Upload l'APK comme artifact (V4)
    - name: 📤 Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: dork-generator-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
        compression-level: 6
    
    # 10. Créer une release GitHub (optionnel)
    - name: 🎉 Create Release
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0-${{ github.run_number }}
        name: Release v1.0 Build ${{ github.run_number }}
        body: |
          🎉 **Dork Generator - Nouvelle version**
          
          ## 📱 Installation
          1. Téléchargez le fichier APK ci-dessous
          2. Activez "Sources inconnues" sur votre Android
          3. Installez l'APK
          
          ## ✨ Fonctionnalités
          - ✅ 8 catégories de dorks
          - ✅ 42 templates prédéfinis
          - ✅ 5 moteurs de recherche
          - ✅ Historique et favoris
          - ✅ Interface Material Design 3
          
          ## 📊 Build Info
          - **Date**: ${{ github.event.head_commit.timestamp }}
          - **Commit**: ${{ github.sha }}
          - **Branch**: ${{ github.ref_name }}
          
          ⚠️ **Usage éducatif uniquement**
        files: app/build/outputs/apk/debug/*.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    # 11. Afficher le résumé
    - name: 📊 Build Summary
      run: |
        echo "### ✅ Build réussi ! 🎉" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "📦 **APK généré**" >> $GITHUB_STEP_SUMMARY
        echo "- Nom: DorkGenerator-v1.0" >> $GITHUB_STEP_SUMMARY
        echo "- Taille: $(du -h app/build/outputs/apk/debug/*.apk | cut -f1)" >> $GITHUB_STEP_SUMMARY
        echo "- Type: Debug APK" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "📥 **Téléchargement**" >> $GITHUB_STEP_SUMMARY
        echo "Allez dans l'onglet 'Actions' → Cliquez sur ce workflow → Section 'Artifacts'" >> $GITHUB_STEP_SUMMARY
